# Thermal-engine configuration of the Lumia 930 (martini), for the MSM8974
# thermal-engine blob of msm8974-common (TheMuppets, oppo).
#
# Thresholds come from the thermal zones of the stock Windows Phone DSDT
# (FFU RM-1045 02540.00019.15236.45005), where they map to a sensor this
# blob can read; everything else keeps the OnePlus One (msm8974-common)
# values. ACPI gives tenths of Kelvin with a 273 K offset, so 3530 = 80 C.
# Windows zone HIDs QCOM2470..QCOM247A are TSENS 0..10 (tsens_tz_sensorN);
# QCOM2491 is the PM8941 die (PMIC_THERM, pm8941_tz here); QCOM248E is
# PA_THERM (PM8941 AMUX 0xb5, pa_therm0 here); QCOM248D is SYS_THERM2 (AMUX
# 0xb4, the skin thermistor), pa_therm1 here with the kernel that renames
# its ADC_TM zone (branch martini-thermal-adc; the blob reads ADC
# thermistors only as pa_therm0 and pa_therm1). See DEVICE-MARTINI.md of
# the workspace for the full zone list.
#
# Never boot-tested. No hotplug actions: the Windows Phone TrustZone cannot
# park the secondary cores again (see init.martini.power.rc).
#
# Parser notes (from the 1520 thermal-engine log, same blob): a section
# whose name is one of the blob's MSM8974 defaults (SS-CPU0..3, SS-POPMEM,
# PMIC-ALARM-MONITOR, ...) only overrides fields and takes no algo_type; a
# new section must start with algo_type, or it is dropped (that is why the
# OnePlus SS-GPU never ran). Comments stay outside the first lines of a
# section.

sampling         5000

# CPU cores, tsens 5-8. Windows throttles each core from 90 C (TZ7/11/14/17,
# 0.1 s sampling) and the PEP from 80 C (TZ6/10/13/16), but its sustained
# limit comes from the skin zones on SYS_THERM2 (48-54 C, TZ36/38/41/46,
# SKIN-* below). The OnePlus 75 C set point, measured on the Lumia 1520
# (cores held at 74-76 C), stays: it was the skin proxy before SYS_THERM2
# could be read; raise it towards the Windows 80-90 C once the skin rules
# are verified on the phone.

[SS-CPU0]
sampling         100
sensor           cpu0
device           cpu
set_point        75000
set_point_clr    60000
override         15000

[SS-CPU1]
sampling         100
sensor           cpu1
device           cpu
set_point        75000
set_point_clr    60000
override         15000

[SS-CPU2]
sampling         100
sensor           cpu2
device           cpu
set_point        75000
set_point_clr    60000
override         15000

[SS-CPU3]
sampling         100
sensor           cpu3
device           cpu
set_point        75000
set_point_clr    60000
override         15000

# tsens 3 (pop_mem): Windows has only the 100 C all-device zone (TZ19);
# the OnePlus 80 C stays (the blob clamps sampling to 50 ms).

[SS-POPMEM]
sampling         50
sensor           pop_mem
device           cpu
set_point        80000
set_point_clr    55000
time_constant    16
override         15000

# tsens 2: Windows throttles the CPUs from 83 C (TZ4, 1 s sampling).

[SS-TSENS2]
algo_type        ss
sampling         1000
sensor           tsens_tz_sensor2
device           cpu
set_point        83000
set_point_clr    68000
override         15000

# tsens 0: Windows throttles the CPUs from 95 C (TZ0, 1 s sampling).

[SS-TSENS0]
algo_type        ss
sampling         1000
sensor           tsens_tz_sensor0
device           cpu
set_point        95000
set_point_clr    80000
override         15000

# GPU, tsens 10 and 9: Windows throttles the GPU from 85 C (TZ23 and TZ21,
# 0.5 s sampling); 85/55 C were also the OnePlus SS-GPU values.

[SS-GPU]
algo_type        ss
sampling         500
sensor           tsens_tz_sensor10
device           gpu
set_point        85000
set_point_clr    55000
override         15000

[SS-GPU-TSENS9]
algo_type        ss
sampling         500
sensor           tsens_tz_sensor9
device           gpu
set_point        85000
set_point_clr    55000
override         15000

# Charging: battery level 1 = 700 mA (qcom,thermal-mitigation of the
# PM8941 charger; the 930 charges at 900 mA at most). OnePlus value: Windows
# limits charging from the skin zones (46 C, TZ34) and at 95 C on tsens 10.

[GPU_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor10
sampling         1000
thresholds       75000
thresholds_clr   55000
actions          battery
action_info      1

# Skin: SYS_THERM2 (pa_therm1). Windows runs 14 passive zones on it
# (TZ34-TZ47 of the DSDT: _PSV 46-54 C, _CRT 56 C). Each one throttles its
# devices with the ACPI passive formula, at most down to the minimum of its
# Thermal Extensions _DSM (percent of the top performance state; no _DSM:
# no minimum). Here each zone is a fixed limit at that minimum, on the
# nearest step, cleared 2 C below its threshold. Not reproduced: the PEP
# zones (TZ35 48 C, min 68 %; TZ44 53 C, min 34 %: the Windows power engine
# has no equivalent here), the modem of TZ47 and SYS_THERM1 (TZ27, 75 C on
# every device: a third thermistor the blob cannot name).
# Needs the martini-thermal-adc kernel: with an older one, pa_therm1 is
# PA_THERM1, a PA thermistor that runs much hotter than the skin.

# CPU: TZ36 48 C min 80 %, TZ38 50 C min 60 %, TZ41 52 C min 48 %, TZ46
# 54 C no minimum (Windows samples them every 0.2 s). With the 2150400 kHz
# top step: 1728000 = 80 %, 1267200 = 59 %, 1036800 = 48 %, 300000 = lowest.

[SKIN-CPU]
algo_type        monitor
sensor           pa_therm1
sampling         1000
thresholds       48000 50000 52000 54000
thresholds_clr   46000 48000 50000 52000
actions          cpu cpu cpu cpu
action_info      1728000 1267200 1036800 300000

# GPU: TZ37 48 C min 90 %, TZ39 50 C min 80 %, TZ42 52 C min 70 %, TZ47
# 54 C no minimum (2 s and 5 s sampling). 450 MHz top: 389 MHz = 86 %
# (nearest step to both 90 and 80 %), 320 MHz = 71 %, 200 MHz = lowest
# active level.

[SKIN-GPU]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       48000 52000 54000
thresholds_clr   46000 50000 52000
actions          gpu gpu gpu
action_info      389000000 320000000 200000000

# Charging (\_SB.NEDD, the Nokia charger and Qi driver): TZ34 46 C min
# 70 %, TZ43 52 C and TZ47 54 C no minimum. Battery levels of
# qcom,thermal-mitigation with the 900 mA ibatmax: 2 = 600 mA (67 %),
# 3 = charging stopped.

[SKIN-CHARGE]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       46000 52000
thresholds_clr   44000 50000
actions          battery battery
action_info      2 3

# Display: TZ40 50 C min 50 % (TZ43 52 C and TZ47 54 C have no minimum,
# kept at 50 % here). The lcd action caps
# /sys/class/leds/lcd-backlight/max_brightness (mdss_fb, 0-255).

[SKIN-LCD]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       50000
thresholds_clr   48000
actions          lcd
action_info      127

# Camera (\_SB.CESP): TZ45 49 C, no minimum. First mitigation level of
# the camera and camcorder clients of thermal-engine; no effect unless the
# camera stack registers as a client.

[SKIN-CAMERA]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       49000
thresholds_clr   47000
actions          camera+camcorder
action_info      1+1

# PM8941 die: Windows throttles every device from 90 C (TZ31, 5 s
# sampling). Limits chosen here: hispeed CPU frequency, 320 MHz GPU,
# battery level 2 (600 mA).

[PMIC-DIE-MONITOR]
algo_type        monitor
sensor           pm8941_tz
sampling         5000
thresholds       90000
thresholds_clr   85000
actions          cpu0+cpu1+cpu2+cpu3+gpu+battery
action_info      1190400+1190400+1190400+1190400+320000000+2

# PM8841 (Krait supply): the blob default offlines cores 1-3 at 107/127 C;
# same thresholds, frequency limits only.

[PMIC-ALARM-MONITOR]
sensor           pm8841_tz
sampling         1000
thresholds       107000 127000
thresholds_clr   103000 123000
actions          cpu0+cpu1+cpu2+cpu3 cpu0+cpu1+cpu2+cpu3+gpu
action_info      960000+960000+960000+960000 300000+300000+300000+300000+200000000

# Shutdown at the Windows critical temperatures (_CRT): 105 C on tsens
# 0, 1, 3-10 (TZ1/3/8/12/15/18/19/20/22/24), 90 C on tsens 2 (TZ5), 85 C
# on PA_THERM (TZ28), 56 C on the skin (SYS_THERM2, TZ47). The OnePlus file
# used 120 C on the cores.

[CPU0_MONITOR]
algo_type        monitor
sensor           cpu0
sampling         1000
thresholds       105000
thresholds_clr   100000
actions          shutdown
action_info      0

[CPU1_MONITOR]
algo_type        monitor
sensor           cpu1
sampling         1000
thresholds       105000
thresholds_clr   100000
actions          shutdown
action_info      0

