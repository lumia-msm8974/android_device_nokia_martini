# Thermal-engine configuration of the Lumia 930 (martini), for the MSM8974
# thermal-engine blob of msm8974-common (TheMuppets, oppo).
#
# Thresholds come from the thermal zones of the stock Windows Phone DSDT
# (FFU RM-1045 02540.00019.15236.45005), where they map to a sensor this
# blob can read; everything else keeps the OnePlus One (msm8974-common)
# values. ACPI gives tenths of Kelvin with a 273 K offset, so 3530 = 80 C.
# Windows zone HIDs QCOM2470..QCOM247A are TSENS 0..10 (tsens_tz_sensorN);
# QCOM2491 is the PM8941 die (PMIC_THERM, pm8941_tz here); QCOM248E is
# PA_THERM (PM8941 AMUX 0xb5, pa_therm0 here); QCOM248D is SYS_THERM2 (AMUX
# 0xb4, the skin thermistor), pa_therm1 here with the kernel that renames
# its ADC_TM zone (branch martini-thermal-adc; the blob reads ADC
# thermistors only as pa_therm0 and pa_therm1). See DEVICE-MARTINI.md of
# the workspace for the full zone list.
#
# Booted with the 75 C core set point since ROM 20261114; the 85 C set
# point and the stepped skin CPU rule were tested at runtime on 24/11/2026
# (10 minutes of 1080p30 camera preview: no CPU limit, no ISP frame drops,
# cores at 75-77 C, skin 45 C); the die rules in fixed steps with the
# 1190 MHz floor on 25/11/2026. No hotplug actions: the Windows Phone
# TrustZone cannot park the secondary cores again (see init.martini.power.rc).
#
# THE BLOB READS ONLY THE FIRST 5120 BYTES OF ITS CONFIGURATION FILE. This
# file, with its comments, is the source: gen-thermal-conf.sh writes
# thermal-engine-8974.conf from it without comments and fails above that
# size. The file shipped from ROM 20261114 to 20261123 had the comments in
# it: the blob loaded the first nine sections (the ss rules) and none of
# the skin, camera, charging and shutdown rules. One monitor now carries
# every level of its sensor, shutdown included, to save room.
#
# Parser notes (from the 1520 thermal-engine log, same blob): a section
# whose name is one of the blob's MSM8974 defaults (SS-CPU0..3, SS-POPMEM,
# PMIC-ALARM-MONITOR, ...) only overrides fields and takes no algo_type; a
# new section must start with algo_type, or it is dropped (that is why the
# OnePlus SS-GPU never ran). Comments stay outside the first lines of a
# section. "disable 1" drops a default section (the log says it ignores the
# 1; without it the section stays).

sampling         5000

# CPU limits from the die sensors. The blob's own rules for the cores and the
# PoP memory (SS-CPU0..3, SS-POPMEM) use the ss algorithm: one frequency step
# down per sample while the sensor is above the set point, with no lower
# bound, so they end at 300 MHz. With the camera on most of the heat is not
# the CPU's (the whole die rises alike at 690 or 1660 MHz), the temperature
# does not come down and ss always reaches the bottom. Below 960 MHz the
# camera pipeline cannot keep up: the VFE drops statistics, the AEC gets its
# luma late and the exposure swings between bright and dark (measured on
# 25/11/2026: steps of light settle in 0.4 s at 960 and 1190 MHz, 1080p60
# never settles at 729 MHz, nothing does at 300-422 MHz).
#
# The blob has no keyword to stop ss at a frequency, so those rules are
# disabled and replaced by monitors with fixed steps. 1190 MHz is the floor up
# to 97 C (the LG G2 and G3 and the LineageOS Nexus 5 never go lower); the two
# steps below it are a last resort before the shutdown, which is the last
# level of each rule: the Windows critical temperatures (_CRT), 105 C on
# tsens 0, 1, 3-10 (TZ1/3/8/12/15/18/19/20/22/24) and 90 C on tsens 2 (TZ5).
# The OnePlus file used 120 C on the cores.
#
# Cores, tsens 5-8: Windows throttles each core from 90 C (TZ7/11/14/17) and
# the PEP from 80 C (TZ6/10/13/16, minimum 34 % of the top performance
# state); the LG G2 and G3 start at 85 C, the blob default is 90 C. The
# OnePlus 75 C held the cores of the 930 at 74-77 C with the camera on while
# the skin was at 41-42 C.

[SS-CPU0]
disable          1

[SS-CPU1]
disable          1

[SS-CPU2]
disable          1

[SS-CPU3]
disable          1

[CPU0-STEP]
algo_type        monitor
sensor           cpu0
sampling         250
thresholds       85000 88000 91000 97000 101000 105000
thresholds_clr   80000 85000 88000 93000 97000 100000
actions          cpu cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1190400 729600 300000 0

[CPU1-STEP]
algo_type        monitor
sensor           cpu1
sampling         250
thresholds       85000 88000 91000 97000 101000 105000
thresholds_clr   80000 85000 88000 93000 97000 100000
actions          cpu cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1190400 729600 300000 0

[CPU2-STEP]
algo_type        monitor
sensor           cpu2
sampling         250
thresholds       85000 88000 91000 97000 101000 105000
thresholds_clr   80000 85000 88000 93000 97000 100000
actions          cpu cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1190400 729600 300000 0

[CPU3-STEP]
algo_type        monitor
sensor           cpu3
sampling         250
thresholds       85000 88000 91000 97000 101000 105000
thresholds_clr   80000 85000 88000 93000 97000 100000
actions          cpu cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1190400 729600 300000 0

# tsens 3 (pop_mem): Windows has only the 100 C all-device zone (TZ19); the
# blob default and the OnePlus file start at 80 C. Same start, in steps.

[SS-POPMEM]
disable          1

[POPMEM-STEP]
algo_type        monitor
sensor           pop_mem
sampling         250
thresholds       80000 83000 86000 89000 97000 101000 105000
thresholds_clr   75000 80000 83000 86000 93000 97000 100000
actions          cpu cpu cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1267200 1190400 729600 300000 0

# tsens 2: Windows throttles the CPUs from 83 C (TZ4, 1 s sampling) and shuts
# down at 90 C (TZ5), so the floor gives way earlier here.

[TSENS2-STEP]
algo_type        monitor
sensor           tsens_tz_sensor2
sampling         1000
thresholds       83000 85000 87000 89000 90000
thresholds_clr   80000 83000 85000 87000 88000
actions          cpu cpu cpu cpu shutdown
action_info      1497600 1190400 729600 300000 0

# tsens 0: Windows throttles the CPUs from 95 C (TZ0, 1 s sampling).

[TSENS0-STEP]
algo_type        monitor
sensor           tsens_tz_sensor0
sampling         1000
thresholds       95000 98000 101000 105000
thresholds_clr   90000 95000 98000 100000
actions          cpu cpu cpu shutdown
action_info      1190400 729600 300000 0

# GPU, tsens 10 and 9: Windows throttles the GPU from 85 C (TZ23 and TZ21,
# 0.5 s sampling); 85/55 C were also the OnePlus SS-GPU values.

[SS-GPU]
algo_type        ss
sampling         500
sensor           tsens_tz_sensor10
device           gpu
set_point        85000
set_point_clr    55000
override         15000

[SS-GPU-TSENS9]
algo_type        ss
sampling         500
sensor           tsens_tz_sensor9
device           gpu
set_point        85000
set_point_clr    55000
override         15000

# Charging: battery level 1 = 700 mA (qcom,thermal-mitigation of the
# PM8941 charger; the 930 charges at 900 mA at most). OnePlus value: Windows
# limits charging from the skin zones (46 C, TZ34) and at 95 C on tsens 10.

[GPU_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor10
sampling         1000
thresholds       75000
thresholds_clr   55000
actions          battery
action_info      1

# Skin: SYS_THERM2 (pa_therm1). Windows runs 14 passive zones on it
# (TZ34-TZ47 of the DSDT: _PSV 46-54 C, _CRT 56 C). Each one throttles its
# devices with the ACPI passive formula, at most down to the minimum of its
# Thermal Extensions _DSM (percent of the top performance state; no _DSM:
# no minimum). Here each zone is a fixed limit at that minimum, on the
# nearest step, cleared 2 C below its threshold. Not reproduced: the PEP
# zones (TZ35 48 C, min 68 %; TZ44 53 C, min 34 %: the Windows power engine
# has no equivalent here), the modem of TZ47 and SYS_THERM1 (TZ27, 75 C on
# every device: a third thermistor the blob cannot name).
# Needs the martini-thermal-adc kernel: with an older one, pa_therm1 is
# PA_THERM1, a PA thermistor that runs much hotter than the skin.

# CPU: TZ36 48 C min 80 %, TZ38 50 C min 60 %, TZ41 52 C min 48 %, TZ46
# 54 C no minimum (Windows samples them every 0.2 s) and TZ47 56 C critical.
# Windows reaches its minimum through the ACPI passive formula, a step at a
# time, so the limit comes down in steps here too. 1190 MHz is the floor, as
# on the LG G2 and G3 and for the same reason as the die rules above: the
# camera pipeline does not work below 960 MHz. The last level is a shutdown
# at 65 C. Windows has it at 56 C (TZ47 _CRT), which no Android phone of this
# SoC generation comes near: the LG G2 and G3, the Nexus 5, the Galaxy S5 and
# Note 3, the Moto X 2014 and the OnePlus One shut down on the die sensors
# only, the Xperia Z1 at 85 C on a board thermistor, and Android itself at
# 68 C of battery. The skin read 45 C after ten minutes of camera preview.

[SKIN-CPU]
algo_type        monitor
sensor           pa_therm1
sampling         1000
thresholds       48000 50000 52000 54000 65000
thresholds_clr   46000 48000 50000 52000 60000
actions          cpu cpu cpu cpu shutdown
action_info      1728000 1497600 1267200 1190400 0

# GPU: TZ37 48 C min 90 %, TZ39 50 C min 80 %, TZ42 52 C min 70 %, TZ47
# 54 C no minimum (2 s and 5 s sampling). 450 MHz top: 389 MHz = 86 %
# (nearest step to both 90 and 80 %), 320 MHz = 71 %, 200 MHz = lowest
# active level.

[SKIN-GPU]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       48000 52000 54000
thresholds_clr   46000 50000 52000
actions          gpu gpu gpu
action_info      389000000 320000000 200000000

# Charging (\_SB.NEDD, the Nokia charger and Qi driver): TZ34 46 C min
# 70 %, TZ43 52 C and TZ47 54 C no minimum. Battery levels of
# qcom,thermal-mitigation with the 900 mA ibatmax: 2 = 600 mA (67 %),
# 3 = charging stopped.

[SKIN-CHARGE]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       46000 52000
thresholds_clr   44000 50000
actions          battery battery
action_info      2 3

# Display: TZ40 50 C min 50 % (TZ43 52 C and TZ47 54 C have no minimum,
# kept at 50 % here). The lcd action caps
# /sys/class/leds/lcd-backlight/max_brightness (mdss_fb, 0-255).

[SKIN-LCD]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       50000
thresholds_clr   48000
actions          lcd
action_info      127

# Camera (\_SB.CESP): TZ45 49 C, no minimum. The QCamera2 HAL registers
# both clients; level 1 halves the preview and video frame rate and skips
# every other frame, also in the middle of a recording (Windows stops the
# recording instead). Kept at the Windows 49 C: with the camera on the whole
# die heats by 20 C in 3 minutes whatever the CPU frequency (690 or
# 1660 MHz on average gave the same curve), so the camera rate is the one
# limit that cuts the VFE, CPP and memory work that heats it.

[SKIN-CAMERA]
algo_type        monitor
sensor           pa_therm1
sampling         2000
thresholds       49000
thresholds_clr   47000
actions          camera+camcorder
action_info      1+1

# PM8941 die: Windows throttles every device from 90 C (TZ31, 5 s
# sampling). Limits chosen here: hispeed CPU frequency, 320 MHz GPU,
# battery level 2 (600 mA).

[PMIC-DIE-MONITOR]
algo_type        monitor
sensor           pm8941_tz
sampling         5000
thresholds       90000
thresholds_clr   85000
actions          cpu0+cpu1+cpu2+cpu3+gpu+battery
action_info      1190400+1190400+1190400+1190400+320000000+2

# PM8841 (Krait supply): the blob default offlines cores 1-3 at 107/127 C;
# same thresholds, frequency limits only.

[PMIC-ALARM-MONITOR]
sensor           pm8841_tz
sampling         1000
thresholds       107000 127000
thresholds_clr   103000 123000
actions          cpu0+cpu1+cpu2+cpu3 cpu0+cpu1+cpu2+cpu3+gpu
action_info      960000+960000+960000+960000 300000+300000+300000+300000+200000000

# Shutdown at the Windows critical temperatures (_CRT) for the sensors
# without a rule above: 105 C on tsens 1, 4, 9 and 10 (TZ3/12/22/24) and
# 85 C on PA_THERM (TZ28).

[TSENS1_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor1
sampling         1000
thresholds       105000
thresholds_clr   100000
actions          shutdown
action_info      0

[TSENS4_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor4
sampling         1000
thresholds       105000
thresholds_clr   100000
actions          shutdown
action_info      0

[TSENS9_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor9
sampling         1000
thresholds       105000
thresholds_clr   100000
actions          shutdown
action_info      0

[TSENS10_MONITOR]
algo_type        monitor
sensor           tsens_tz_sensor10
sampling         1000
thresholds       105000
thresholds_clr   100000
actions          shutdown
action_info      0

[PA_THERM0_MONITOR]
algo_type        monitor
sensor           pa_therm0
sampling         5000
thresholds       85000
thresholds_clr   80000
actions          shutdown
action_info      0
