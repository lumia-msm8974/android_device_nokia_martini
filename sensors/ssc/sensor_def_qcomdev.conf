# Magnetometer soft-iron matrix of the 930 registry, NOT applied (no
# matching item is known in this registry; on Windows qcSensors8974.dll
# applies it on the application processor, with the phone's own hard-iron
# calibration from DPP): ...\qcSensors\Parameters\Mag ConfigVersion 6,
# Mag\0\0 Algorithm 3, E11..E33 in units of 1/10000:
#    9270  -551    44
#     269 10235    53
#    -392   -65 10525
# (the shared INF has E22 = 10237).
