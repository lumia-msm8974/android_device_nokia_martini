#
# Sensors registry defaults for the Lumia 930 (martini): the Qualcomm Sensor
# Core (SSC) on the ADSP, read by sensors.qcom (msm8974-common blob) when it
# creates /data/misc/sensors/sns.reg. sensors.qcom picks up every
# /etc/sensor_def_*.conf; the name is the one of the OnePlus One file.
#
# EXPERIMENTAL, never run on a 930: see SENSORS-SSC-MARTINI.md of the project
# and sensors/ssc/check-sensor-def.py.
#
# Source of the values: the Windows Phone 8.1 registry of the 930, value
#   HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\WUDF\Services\
#   qcSensors\Parameters, "23" (256 bytes) and "31" (12 bytes)
# in the official RM-1045 FFU 02540.00019.15236.45005 (identical to the
# [WdfExt_AddReg] of qcSensors8974.inf 1.0.1057.0, package
# OEM.SOC_QC8974.NMO). qcSensors8974.dll is a Windows build of the same
# Qualcomm sensor daemon: its registry tables (1419 items, groups 0-50) have
# the same item offsets as the 1854 items of this sensors.qcom. The value
# names are registry group indexes: "23" is group 2690 (SSI SMGR config,
# file offset 0x1700, 256 bytes), "31" is group 2800 (SSI GPIO config, file
# offset 0x1f00; 12 bytes on Windows, 34 here). "@0xNN" below is the byte
# offset inside the Windows value. 64-bit items are stored little endian,
# so a UUID read as bytes b0..b15 is UUID_HIGH = LE64(b0..b7) and
# UUID_LOW = LE64(b8..b15).
#
# Orientation: \_SB.SEN1 (QCOM2495) AROT/GROT/MROT in the 930 SSDT. They map
# chip axes to the Windows frame; Windows reports gravity (flat face up:
# z = -1 g), Android the reaction to it, so the accelerometer matrix is the
# ACPI one negated (as for the Lumia 1520, where the raw z axis read -1 g
# face up). All three matrices are symmetric, so the meaning of the
# registry items (device axis from chip axis, or the reverse) gives the
# same values.
#
# Format: <item> <value> <version>, see the OnePlus One file. Item versions
# are compared with the ones stored in sns.reg: to apply a changed value to
# an existing registry, raise its version and :version, or delete sns.reg.
#

:version 0x00010001

:hardware
:platform
:property
:soc_id

########################################################################
# Orientation (driver groups 1000/1010/1020, the reg_group_id of the
# SMGR entries below)
########################################################################
# Accelerometer, AROT "-1 0 0 / 0 1 0 / 0 0 1" (det -1), negated:
# x = +x, y = -y, z = -z
700  1 0x00010001
701 -2 0x00010001
702 -3 0x00010001
# Gyroscope, GROT "0 -1 0 / -1 0 0 / 0 0 -1": x = -y, y = -x, z = -z
800 -2 0x00010001
801 -1 0x00010001
802 -3 0x00010001
# Magnetometer, MROT "-1 0 0 / 0 1 0 / 0 0 -1": x = -x, y = +y, z = -z
900 -1 0x00010001
901  2 0x00010001
902 -3 0x00010001

